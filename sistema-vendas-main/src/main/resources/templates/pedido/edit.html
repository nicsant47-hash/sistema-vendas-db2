<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Pedido</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Pedido <span th:text="'#' + ${pedido.id}"></span></h1>
    <p>
        <strong>Cliente:</strong> <span th:text="${pedido.cliente.nome}"></span><br>
        <strong>Data:</strong> <span th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></span><br>
        <strong>Status:</strong> <span class="badge bg-success" th:text="${pedido.status}"></span>
    </p>

    <h4>Adicionar item</h4>
    <form class="row g-2 mb-4" th:action="@{/pedidos/{id}/adicionar-item(id=${pedido.id})}" method="post">
        <div class="col-md-7">
            <select class="form-select" name="produtoId" required>
                <option value="" selected disabled>Selecione um produto...</option>
                <option th:each="produto : ${produtos}"
                        th:value="${produto.id}"
                        th:disabled="${produto.quantidadeEmEstoque == 0}"
                        th:text="${produto.nome + ' - R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA') + ' (estoque: ' + produto.quantidadeEmEstoque + ')'}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <input type="number" class="form-control" name="quantidade" min="1" value="1" required>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-primary w-100">Adicionar</button>
        </div>
    </form>

    <h4>Itens</h4>
    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço Unitário</th>
            <th>Subtotal</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${pedido.itens}">
            <td th:text="${item.produto.nome}"></td>
            <td th:text="${item.quantidade}"></td>
            <td th:text="${'R$ ' + #numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
            <td th:text="${'R$ ' + #numbers.formatDecimal(item.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
            <td>
                <form th:action="@{/pedidos/{pid}/remover-item/{iid}(pid=${pedido.id}, iid=${item.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-danger">Remover</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(pedido.itens)}">
            <td colspan="5" class="text-center text-muted">Nenhum item adicionado.</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="3" class="text-end">Total</th>
            <th colspan="2" th:text="${'R$ ' + #numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></th>
        </tr>
        </tfoot>
    </table>

    <form th:action="@{/pedidos/{id}/finalizar(id=${pedido.id})}" method="post">
        <button type="submit" class="btn btn-success">Finalizar</button>
        <a class="btn btn-outline-danger" th:href="@{/pedidos/cancelar/{id}(id=${pedido.id})}">Cancelar Pedido</a>
        <a class="btn btn-secondary" th:href="@{/pedidos}">Voltar</a>
    </form>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
